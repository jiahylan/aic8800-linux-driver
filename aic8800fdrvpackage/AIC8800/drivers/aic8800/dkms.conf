PACKAGE_NAME="aic8800"
PACKAGE_VERSION="1.3.1"
BUILT_MODULE_NAME[0]="aic_load_fw"
BUILT_MODULE_LOCATION[0]="aic_load_fw/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/aic8800"
BUILT_MODULE_NAME[1]="aic8800_fdrv"
BUILT_MODULE_LOCATION[1]="aic8800_fdrv/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/net/wireless/aic8800"
# Quote 'make' to prevent DKMS appending a second -j flag. Keep thermal load low.
MAKE[0]="'make' -j4 KVER=${kernelver}"
# Match the compiler used by the target kernel, including future DKMS rebuilds.
aic_config="${kernel_source_dir:-/lib/modules/${kernelver}/build}/include/config/auto.conf"
if [ -r "$aic_config" ]; then
    aic_gcc_version=$(sed -n 's/^CONFIG_GCC_VERSION=//p' "$aic_config")
    case "$aic_gcc_version" in
        ''|*[!0-9]*) ;;
        *) if [ "$aic_gcc_version" -gt 0 ]; then
               MAKE[0]="${MAKE[0]} CC=gcc-$((aic_gcc_version / 10000))"
           fi ;;
    esac
fi
CLEAN="make clean"
AUTOINSTALL="yes"
